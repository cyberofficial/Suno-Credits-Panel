<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Suno Credits</title>
  <style>
    :root {
      --sc-primary: #fd429c;
      --sc-text: #1a1a1a;
      --sc-text-muted: #666;
      --sc-border: #e0e0e0;
      --sc-error: #d93025;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      width: 260px;
      padding: 16px;
      margin: 0;
      color: var(--sc-text);
    }
    h2 {
      margin: 0 0 4px;
      font-size: 14px;
      font-weight: 600;
      color: var(--sc-text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .credits {
      font-size: 32px;
      font-weight: 700;
      margin: 4px 0 2px;
      line-height: 1.1;
    }
    .credits-label {
      font-size: 12px;
      color: var(--sc-text-muted);
      margin-bottom: 10px;
    }
    .usage-top {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--sc-text-muted);
      margin-bottom: 4px;
    }
    .bar {
      height: 6px;
      background: var(--sc-border);
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 10px;
    }
    .bar-fill {
      height: 100%;
      width: 0;
      background: var(--sc-primary);
      border-radius: 3px;
      transition: width 0.3s ease;
    }
    .row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--sc-text-muted);
      margin-top: 4px;
    }
    .status {
      font-size: 11px;
      margin-top: 8px;
      text-align: center;
    }
    .status.active { color: var(--sc-primary); }
    .status.past-due { color: var(--sc-error); }
    .updated {
      font-size: 10px;
      color: #999;
      text-align: right;
      margin-top: 8px;
    }
    .refresh-btn {
      background: var(--sc-primary);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      margin-top: 12px;
      width: 100%;
    }
    .refresh-btn:hover { filter: brightness(0.92); }
    .refresh-btn:disabled { opacity: 0.6; cursor: default; }
    .error {
      color: var(--sc-error);
      margin-top: 10px;
      font-size: 12px;
      display: none;
    }
    .loading { color: #5f6368; font-style: italic; }
  </style>
</head>
<body>
  <h2>Suno Credits</h2>
  <div class="credits loading" id="credits">Loading...</div>
  <div class="credits-label">daily credits left</div>

  <div class="usage-top">
    <span>Daily usage</span>
    <span id="usage">-- / --</span>
  </div>
  <div class="bar"><div class="bar-fill" id="barFill"></div></div>

  <div class="row" id="backupRow" style="display:none">
    <span>Backup balance</span><span id="backup">--</span>
  </div>
  <div class="row" id="totalRow" style="display:none">
    <span>Total available</span><span id="total">--</span>
  </div>
  <div class="status" id="status"></div>
  <div class="updated" id="updated"></div>
  <button class="refresh-btn" id="refreshBtn">Refresh</button>
  <div id="error" class="error"></div>

  <script src="popup.js"></script>
</body>
</html>
